# EU Elevation Module — Build & Push
# =============================================================================
# On push to main or version tag:
#   1. Validate: frontend typecheck + backend import smoke test
#   2. Build IIFE bundle → upload as artifact
#   3. Build & push backend Docker image to GHCR
#
# CI deploys the frontend bundle to MinIO with immutable versioned paths.
# =============================================================================

name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================================
  # Validate
  # ==========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend deps + typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend smoke test
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -c "from app.main import app; print('app import ok')"

  # ==========================================================================
  # Build IIFE Bundle
  # ==========================================================================
  build-iife:
    name: Build IIFE Bundle
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build module bundle
        run: pnpm run build:module
        env:
          NKZ_VERSION_HASH: ${{ github.sha }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nkz-module
          path: dist/nkz-module.js
          retention-days: 30

      - name: Check MinIO Secrets
        id: check_secrets
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.MINIO_ROOT_USER }}" ] && [ -n "${{ secrets.MINIO_ROOT_PASSWORD }}" ] && [ -n "${{ secrets.MINIO_URL }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup MinIO Client
        if: steps.check_secrets.outputs.has_secrets == 'true' && github.event_name != 'pull_request'
        run: |
          docker create --name mcbits ghcr.io/nkz-os/mc:RELEASE.2024-11-21T17-21-54Z
          docker cp mcbits:/usr/bin/mc /usr/local/bin/mc
          docker rm mcbits
          chmod +x /usr/local/bin/mc

      - name: Upload to MinIO (versioned)
        if: steps.check_secrets.outputs.has_secrets == 'true' && github.event_name != 'pull_request'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          mc alias set nkz "${{ secrets.MINIO_URL }}" "${{ secrets.MINIO_ROOT_USER }}" "${{ secrets.MINIO_ROOT_PASSWORD }}"
          mc cp --recursive ./dist/ "nkz/nekazari-frontend/modules/eu-elevation/${SHORT_SHA}/"
          mc anonymous set public "nkz/nekazari-frontend/modules/eu-elevation/${SHORT_SHA}/"

      - name: Activate version
        if: steps.check_secrets.outputs.has_secrets == 'true' && github.event_name != 'pull_request'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          curl -s -X POST "${{ secrets.API_URL }}/api/modules/eu-elevation/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${{ secrets.NKZ_INTERNAL_TOKEN }}" \
            -d "{\"version\": \"${SHORT_SHA}\"}" \
            || echo "WARNING: deploy activation failed (API may not support /deploy yet)"

  # ==========================================================================
  # Build & Push Backend Image
  # ==========================================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## EU Elevation Backend Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "After push, deploy to K8s:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`kubectl rollout restart deployment/elevation-api elevation-worker -n nekazari\`" >> "$GITHUB_STEP_SUMMARY"

  # Publish MF2 remote via OIDC (push to main only)
  publish-module:
    name: Publish Module
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: nkz-os/nkz/.github/workflows/_publish-module.yml@main
    with:
      module_id: nkz-module-eu-elevation
    secrets:
      INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
