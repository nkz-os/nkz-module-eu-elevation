---
# Secret: Elevation DB credentials
# Template: replace the placeholder before applying, or create the Secret
# elevation-db-secret with the key DATABASE_URL out of band.
apiVersion: v1
kind: Secret
metadata:
  name: elevation-db-secret
  namespace: nekazari
type: Opaque
stringData:
  # Replace with actual credentials before applying
  DATABASE_URL: "postgresql://nekazari:CHANGE_ME@postgresql-service:5432/nekazari"
