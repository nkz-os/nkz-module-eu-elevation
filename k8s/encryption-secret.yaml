---
# Reference only — create the Secret elevation-encryption-secret with the key
# encryption-key out of band. Generate the value with:
#   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
# NEVER commit the real key to version control.
apiVersion: v1
kind: Secret
metadata:
  name: elevation-encryption-secret
  namespace: nekazari
  labels:
    app: eu-elevation
    module: eu-elevation
type: Opaque
